# Не доделал
variables:
  REDIS_PORT: 6379

services:
  go-program:
    build:
      context: .
      dockerfile: ./back/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./back:/app
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:alpine
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=mydb
    ports:
      - "5432:5432"